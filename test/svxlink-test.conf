# Instancia SvxLink de prueba: no toca systemd ni la tarjeta de sonido real.
# Ejecutar desde la raiz del proyecto (scripts/run-test.sh lo hace):
#   /usr/local/bin/svxlink --config=test/svxlink-test.conf

[GLOBAL]
LOGICS=SimplexLogic
# run-test.sh lo sustituye por build/test-config-text
CFG_DIR=__CFG_DIR__
# Relativo al directorio de trabajo (raiz del proyecto)
MODULE_PATH=build
CARD_SAMPLE_RATE=48000
CARD_CHANNELS=1
TIMESTAMP_FORMAT="%c"

[SimplexLogic]
TYPE=Simplex
RX=Rx1
TX=Tx1
MODULES=ModuleRnsPartyline
CALLSIGN=TEST
DEFAULT_LANG=es_ES
# Arbol Tcl local: evita instalar RnsPartyline.tcl en /usr/local y no usa sudo.
# scripts/run-test.sh sustituye __PROJECT_ROOT__ y genera build/svxlink-test.conf.
EVENT_HANDLER=__PROJECT_ROOT__/test/events.tcl

[Rx1]
TYPE=Local
AUDIO_DEV=alsa:null
AUDIO_CHANNEL=0
AUDIO_DEV_KEEP_OPEN=1
SQL_DET=VOX
VOX_FILTER_DEPTH=20
VOX_THRESH=1000
DTMF_DEC_TYPE=INTERNAL

[Tx1]
TYPE=Local
AUDIO_DEV=alsa:null
AUDIO_CHANNEL=0
AUDIO_DEV_KEEP_OPEN=1
PTT_TYPE=NONE
