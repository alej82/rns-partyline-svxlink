# Instancia local de prueba con la tarjeta real Fred y PTT Hidraw.
# Requiere parar svxlink.service mientras se usa. No edita /usr/local/etc.
# Generar build/svxlink-test-radio.conf sustituyendo __PROJECT_ROOT__ y
# __CFG_DIR__ (ver README, "Test with a real radio").
[GLOBAL]
LOGICS=SimplexLogic
CFG_DIR=__CFG_DIR__
MODULE_PATH=build
CARD_SAMPLE_RATE=48000
CARD_CHANNELS=1
TIMESTAMP_FORMAT="%c"

[SimplexLogic]
TYPE=Simplex
RX=Rx1
TX=Tx1
MODULES=ModuleRnsPartyline
CALLSIGN=N0CALL
DEFAULT_LANG=es_ES
REPORT_CTCSS=136.5
EVENT_HANDLER=__PROJECT_ROOT__/test/events.tcl

[Rx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:CARD=Fred,DEV=0
AUDIO_CHANNEL=0
AUDIO_DEV_KEEP_OPEN=1
LIMITER_THRESH=-6
SQL_DET=CTCSS
CTCSS_FQ=100.0
SQL_DELAY=0
SQL_HANGTIME=2000
VOX_FILTER_DEPTH=20
VOX_THRESH=1000
SIGLEV_SLOPE=1
SIGLEV_OFFSET=0
SQL_SIGLEV_OPEN_THRESH=30
SQL_SIGLEV_CLOSE_THRESH=10
DEEMPHASIS=0
DTMF_DEC_TYPE=INTERNAL
DTMF_MUTING=1
DTMF_HANGTIME=40
PEAK_METER=1

[Tx1]
TYPE=Local
AUDIO_DEV=alsa:plughw:CARD=Fred,DEV=0
AUDIO_CHANNEL=0
AUDIO_DEV_KEEP_OPEN=1
LIMITER_THRESH=-6
PTT_TYPE=Hidraw
HID_DEVICE=/dev/cm108gpio
HID_PTT_PIN=GPIO3
TX_DELAY=500
PREEMPHASIS=0
