# Variante de prueba M2: audio por UDP, sin tarjeta de sonido ni radio.
# scripts/run-test.sh --audio genera build/svxlink-test.conf a partir de este
# archivo y arranca el sidecar con la configuracion de audio.
#   Rx1 escucha PCM int16 en 127.0.0.1:52010
#   Tx1 envia PCM int16 a 127.0.0.1:52011
# Usa scripts/audio-tone.py para inyectar/capturar.

[GLOBAL]
LOGICS=SimplexLogic
CFG_DIR=__CFG_DIR__
MODULE_PATH=build
CARD_SAMPLE_RATE=48000
CARD_CHANNELS=2
TIMESTAMP_FORMAT="%c"

[SimplexLogic]
TYPE=Simplex
RX=Rx1
TX=Tx1
MODULES=ModuleRnsPartyline
CALLSIGN=TEST
DEFAULT_LANG=es_ES
EVENT_HANDLER=__PROJECT_ROOT__/test/events.tcl
# El modulo en modo audio se auto-activa; Tx1 solo transmite el audio remoto.
MUTE_TX_ON_RX=1

[Rx1]
TYPE=Local
AUDIO_DEV=udp:127.0.0.1:52010
AUDIO_CHANNEL=0
AUDIO_DEV_KEEP_OPEN=1
SQL_DET=VOX
VOX_FILTER_DEPTH=20
VOX_THRESH=1000
DTMF_DEC_TYPE=INTERNAL

[Tx1]
TYPE=Local
AUDIO_DEV=udp:127.0.0.1:52011
AUDIO_CHANNEL=0
AUDIO_DEV_KEEP_OPEN=1
PTT_TYPE=NONE
