# Configuracion compartida por el modulo SvxLink y el sidecar Partyline.
# Un solo archivo INI: SvxLink lee [ModuleRnsPartyline] y [bridge]; el
# sidecar lee [bridge] y [partyline]. Las claves desconocidas se ignoran.
#
# Manten los comentarios en lineas propias: configparser no elimina los
# comentarios al final de una linea.

[ModuleRnsPartyline]
# Nombre del plugin: SvxLink busca Module<NAME>.so.
NAME=RnsPartyline
# Identificador DTMF del modulo (lo lee la clase base Module).
ID=3
# 1 = conectar al sidecar al inicializar, sin esperar activacion por DTMF.
AUTO_CONNECT=1
# 1 = activar el modulo automaticamente en modo audio (M2). 0 = solo por DTMF.
AUTO_ACTIVATE=1

[bridge]
# Socket Unix donde el sidecar publica el estado. Debe ser absoluto.
# Por defecto: /tmp/rns-partyline-svx.sock
SOCKET_PATH=/tmp/rns-partyline-svx.sock
# Espera entre reintentos de conexion del modulo (ms). Minimo 100.
# Por defecto: 5000
RECONNECT_DELAY_MS=5000
# 1 = en modo audio el sidecar espera la activacion del modulo (3#) antes de
# conectar a Partyline. 0 = conecta al arrancar (comportamiento clasico).
# La opcion --connect-now fuerza tambien el modo clasico. Con TEXT_ONLY=1 el
# sidecar conecta al arrancar aunque esta clave valga 1.
# Por defecto: 1
CONNECT_ON_ACTIVATE=1
# Socket Unix del audio PCM. Debe ser absoluto y distinto de SOCKET_PATH.
# Por defecto: SOCKET_PATH + ".audio"
AUDIO_SOCKET_PATH=/tmp/rns-partyline-svx.sock.audio
# Tamano de bloque PCM que envia el modulo (ms). Por defecto: 20
AUDIO_PUSH_MS=20

[partyline]
# Hash de destino del servidor Partyline (32 caracteres hexadecimales).
SERVER_HASH=00000000000000000000000000000000
# Sala: numero (1..N en el orden del servidor) o nombre exacto sin distinguir
# mayusculas, por ejemplo: ROOM=Opus High
ROOM=Opus High
# Nombre visible del modulo dentro de Partyline (maximo 48 caracteres).
USER_NAME=SvxLink-N0CALL
# Contrasena del servidor. Vacio = el servidor no la pide.
SERVER_PASSWORD=
# Contrasena de la sala. Vacio = la sala no la pide.
ROOM_PASSWORD=
# Directorio de configuracion de Reticulum. Debe existir y usar
# share_instance = No para este sidecar.
RNS_CONFIG_DIR=~/.config/partyline-dev/client-rns
# Identidad RNS del sidecar. Se crea con permisos 0600 si no existe.
IDENTITY_FILE=~/.config/rns-partyline-svx/identity
# 0 = modo audio (M2: socket de audio + PTT). 1 = modo control (M1, solo texto).
TEXT_ONLY=0
# Frecuencia del pipeline de SvxLink; se envia en el hello para M2.
SAMPLE_RATE=48000
# Familias de codec permitidas: opus, c2 (vacio = todas).
ALLOWED_CODECS=opus,c2
# Modo de PTT del cliente Partyline: ptt (squelch), vox u open.
PTT_MODE=ptt
# 1 = half-duplex: el audio local silencia el audio remoto mientras se transmite.
HALF_DUPLEX=1
